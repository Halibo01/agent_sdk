name: Publish Python Package

on:
  release:
    types: [published]
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        # Install project dependencies
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Install the package itself in editable mode to test imports
        pip install -e .[all]

    - name: Run tests
      run: |
        pytest tests/

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Sadece release yayınlandığında çalışır
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write  # IMPORTANT: Mandatory for trusted publishing
      contents: read

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Verify No Sensitive Files
      run: |
        # Basit bir kontrol: oluşturulan tar.gz içinde .env var mı?
        if tar -tf dist/*.tar.gz | grep -q ".env"; then
          echo "SECURITY ERROR: .env file found in distribution!"
          exit 1
        else
          echo "Security Check Passed: No .env file in distribution."
        fi

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # Eğer Trusted Publishing kullanmıyorsanız, Repository Secrets altında PYPI_API_TOKEN tanımlamanız gerekir.
      # with:
      #   password: ${{ secrets.PYPI_API_TOKEN }}
