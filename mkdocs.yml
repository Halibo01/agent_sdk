site_name: Agent SDK Core
site_url: https://agent-sdk-core.dev/
site_description: "A lightweight, zero-dependency Python framework for building LLM Agents and Swarms."
repo_url: https://github.com/Halibo01/agent_sdk
repo_name: Halibo01/agent_sdk

plugins:
  - tags
  - search
  - minify:
      minify_html: true
  - social:
      cards_layout_options:
        background_color: "#2f3136"
  - git-revision-date-localized:
      type: timeago
      enable_creation_date: true

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

theme:
  name: material
  logo: material/robot
  favicon: material/robot
  palette: 
    scheme: slate
    primary: indigo
  features:
    - content.code.copy
    - navigation.expand
    - navigation.tabs
    - navigation.top
    - navigation.tracking

nav:
  - Home: index.md
  - Docs: 
    - Introduction: docs/index.md
    - Getting Started:
        - Installation: getting-started/installation.md
        - Quick Start: getting-started/quickstart.md
    
    - Core Modules:
        - Universal Clients: docs/modules/universal-llm-clients.md
        - Agents & Runners: docs/modules/agents-and-runners-core-concepts.md
        - Middleware System:
            - Overview: docs/modules/middlewares/index.md
            - RAG & Knowledge: docs/modules/middlewares/retrieval-augmented-generation-rag-middleware.md
            - Memory Management: docs/modules/middlewares/memory-management-and-summarization-middleware.md
            - Safety & Control: docs/modules/middlewares/ai-safety-and-human-control-middleware.md
            - Logging & Context: docs/modules/middlewares/agent-logging-and-context-injection-middleware.md
            - Custom Middleware: docs/modules/middlewares/building-custom-middleware-extensions.md
        - Tools & Actions: docs/modules/tools-and-function-calling.md

    - Advanced Topics:
        - Swarm & Handoffs: docs/advanced/multi-agent-swarm-mesh.md
        - RAG Integration: docs/advanced/retrieval-augmented-generation-rag.md
    
    - API Reference: docs/api-reference.md