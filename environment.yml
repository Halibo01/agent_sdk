name: agent-sdk
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9
  - pip
  - pip:
      # Core Dependencies
      - requests>=2.28
      - httpx>=0.24
      - colorama
      - python-dotenv
      - markdownify
      
      # Optional Dependencies (All)
      - openai>=1.12.0
      - anthropic>=0.18.0
      - google-generativeai>=0.4.0
      - ollama
      - llama-cpp-python
      - chromadb>=0.4.0
      - duckduckgo-search>=5.0.0
      - wikipedia
      
      # Documentation
      - mkdocs>=1.4.0
      - mkdocs-material>=9.0.0
      - mkdocs-minify-plugin>=0.7.0
      - mkdocs-git-revision-date-localized-plugin>=1.2.0
      - mkdocs-redirects>=1.2.0
      
      # Development & Testing
      - pytest
      - pytest-asyncio
      - ruff
      - black
      - mypy
      - pre-commit
      - build
      - -e .
